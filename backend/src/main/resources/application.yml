spring:
  application:
    name: backend
  # 数据源:PostgreSQL,连接信息全部走环境变量,本地默认仅供开发
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personal_nav}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 表结构由 Flyway 管,这里只校验实体与表是否一致
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # 会话存到 Redis(服务端 session,Cookie 只持 sessionId)
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: nav:session

server:
  port: ${SERVER_PORT:8080}
  # 真实 IP/协议由可信反向代理经 X-Forwarded-* 统一解析,应用侧不裸读转发头
  forward-headers-strategy: framework
  servlet:
    session:
      # 会话有效期(Redis 中 session 存活时间)
      timeout: ${SESSION_TTL_SECONDS:604800}s
      cookie:
        name: ${SESSION_COOKIE_NAME:NAV_SESSION}
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:Lax}
        max-age: ${SESSION_TTL_SECONDS:604800}s

# 应用自定义配置(供后续里程碑读取)
app:
  # 本地磁盘文件存储目录
  storage:
    local:
      base-dir: ${STORAGE_BASE_DIR:./data/media}
  # 初始管理员:仅当库中无 ADMIN 时,启动用这组凭据创建;留空则跳过
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
